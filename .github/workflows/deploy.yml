name: Deploy Front (React) & Back (Symfony) via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      # --- ÉTAPE 1 : Build du Front-Office (React) ---
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install & Build Front-office
        working-directory: ./front-office
        run: |
          npm install
          npm run build

      # --- ÉTAPE 2 : Déploiement du Front-Office via FTP ---
      - name: 📤 FTP Upload Front-office (React build)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./front-office/build/
          server-dir: /public_html/

      # --- ÉTAPE 3 : Déploiement du Back-Office via FTP ---
      - name: 📤 FTP Upload Back-office (Symfony)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./back-office/
          server-dir: /back.fmed.ml/
          exclude: |
            **/.git*
            **/node_modules/**
            **/var/**
            .env
            .env.*
            README.md
            composer.lock